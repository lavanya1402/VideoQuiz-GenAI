name: Deploy to Azure Web App (Container)

on:
  push:
    branches: [ "main" ]

env:
  AZURE_WEBAPP_NAME: app-videoquiz
  AZURE_RG: rg-videoquiz
  ACR_NAME: acrvideoquiz12345
  IMAGE_NAME: videoquiz
  TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Build the image in ACR (server-side)
      - name: Build & Push to ACR
        uses: azure/acr-build@v1
        with:
          service_principal: ${{ secrets.AZURE_CREDENTIALS }}
          registry: ${{ env.ACR_NAME }}
          repository: ${{ env.IMAGE_NAME }}
          tag: ${{ env.TAG }}
          folder: .
          dockerfile: Dockerfile

      # Get the registry login server (e.g., myregistry.azurecr.io)
      - name: Get ACR login server
        id: acr
        run: echo "login_server=$(az acr show -n $ACR_NAME --query loginServer -o tsv)" >> $GITHUB_OUTPUT

      # Enable MSI on the web app and grant AcrPull (idempotent)
      - name: Allow Web App to pull from ACR
        run: |
          az webapp identity assign -g $AZURE_RG -n $AZURE_WEBAPP_NAME
          PRINCIPAL_ID=$(az webapp show -g $AZURE_RG -n $AZURE_WEBAPP_NAME --query identity.principalId -o tsv)
          ACR_ID=$(az acr show -n $ACR_NAME --query id -o tsv)
          az role assignment create --assignee $PRINCIPAL_ID --role AcrPull --scope $ACR_ID || true

      - name: Update Web App container
        run: |
          az webapp config container set \
            -g $AZURE_RG -n $AZURE_WEBAPP_NAME \
            --docker-custom-image-name ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --docker-registry-server-url https://${{ steps.acr.outputs.login_server }}

      - name: Apply App Settings
        run: |
          az webapp config appsettings set -g $AZURE_RG -n $AZURE_WEBAPP_NAME --settings \
            AZURE_OPENAI_ENDPOINT='${{ secrets.AZURE_OPENAI_ENDPOINT }}' \
            AZURE_OPENAI_API_KEY='${{ secrets.AZURE_OPENAI_API_KEY }}' \
            AZURE_OPENAI_DEPLOYMENT='${{ secrets.AZURE_OPENAI_DEPLOYMENT }}' \
            AZURE_OPENAI_API_VERSION='${{ secrets.AZURE_OPENAI_API_VERSION }}' \
            AZ_SPEECH_KEY='${{ secrets.AZ_SPEECH_KEY }}' \
            AZ_SPEECH_REGION='${{ secrets.AZ_SPEECH_REGION }}' \
            FFMPEG_PATH='/usr/bin' \
            STREAMLIT_SERVER_HEADLESS='true' \
            STREAMLIT_SERVER_ADDRESS='0.0.0.0' \
            STREAMLIT_SERVER_PORT='8501' \
            WEBSITES_PORT='8501' \
            WEBSITES_CONTAINER_START_TIME_LIMIT='1800' \
            SCM_DO_BUILD_DURING_DEPLOYMENT='false' \
            WEBSITE_RUN_FROM_PACKAGE='0' \
            WEBSITE_ENABLE_SYNC_UPDATE_SITE='true'

      - name: Restart app
        run: az webapp restart -g $AZURE_RG -n $AZURE_WEBAPP_NAME
